<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#991277" />
  <title>Playfolio · Catálogo de juegos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <script defer src="script.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="#inicio" aria-label="Playfolio, ir al inicio">P</a>
      <nav aria-label="Navegación principal">
        <a href="#catalogo">Catálogo</a><a href="#buscar">Buscar</a><a href="#plataformas">Plataformas</a>
      </nav>
    </div>
  </header>
  <main id="inicio" class="page-wrap">
    <section class="intro" aria-labelledby="titulo">
      <div class="eyebrow">ELIGE TU PRÓXIMA PARTIDA</div>
      <div class="intro-line"><h1 id="titulo">Catálogo de todos los juegos</h1><p class="counter"><strong id="gameCount">12</strong> <span id="counterLabel">juegos disponibles</span></p></div>
    </section>
    <section class="search-section" id="buscar" aria-label="Buscar juegos">
      <label class="search-box" for="searchInput"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.1"/><path d="m15.4 15.4 4.3 4.3"/></svg><input id="searchInput" type="search" placeholder="Buscar un juego..." autocomplete="off" /></label>
    </section>
    <section class="platforms" id="plataformas" aria-label="Filtrar por plataforma"><div id="platformFilters" class="platform-list"></div></section>
    <section class="catalog-layout" id="catalogo" aria-label="Catálogo de videojuegos">
      <aside class="sidebar" aria-label="Filtros adicionales">
        <div class="filter-block"><h2>GÉNEROS</h2><div id="genreFilters" class="chip-grid"></div></div>
        <div class="filter-block"><h2>JUGADORES</h2><div id="playerFilters" class="chip-grid"></div></div>
        <button id="clearFilters" class="clear-filters" type="button">Limpiar filtros ↺</button>
      </aside>
      <div class="catalog-main">
        <div class="catalog-meta"><span>ORDENADOS DE A–Z</span><span>Haz clic en una portada para saber más</span></div>
        <div id="gameGrid" class="game-grid"></div>
        <p id="emptyState" class="empty-state" hidden>No encontramos juegos con estos filtros. <button id="resetEmpty" type="button">Limpiar filtros</button></p>
      </div>
    </section>
  </main>
  <footer class="footer">Playfolio · Tu próximo juego te está esperando.</footer>
  <dialog id="gameDialog" class="game-dialog" aria-labelledby="dialogTitle">
    <button class="modal-close" id="closeDialog" aria-label="Cerrar información">×</button>
    <div id="dialogContent"></div>
  </dialog>
</body>
</html>
